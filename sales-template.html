<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>【販売ページ】タイトルをここに</title>
<link rel="stylesheet" href="assets/style.css?v=4">
</head>
<body>
<div class="wrap">

  <p class="lead">キャッチ（短いフック）</p>
  <h1>ここにメインのタイトルが入ります</h1>

  <p>導入文。20字前後で区切ると読みやすくなります。<br>
  スマホで読まれる前提で、短く改行します。</p>

  <h2>こんな悩みはありませんか？</h2>
  <ul class="check">
    <li>悩み①</li>
    <li>悩み②</li>
    <li>悩み③</li>
  </ul>

  <h2>この商品でわかること</h2>
  <div class="box">
    <p>中身の説明をここに。</p>
  </div>

  <h2>価格</h2>
  <div class="price"><s>¥00,000</s>¥0,000</div>
  <a class="btn" href="https://example.com">今すぐ受け取る<small>（note / 決済ページへ移動します）</small></a>

  <div class="foot">© ブランド名</div>
</div>
<script src="assets/fit.js"></script>
</body>
</html>
